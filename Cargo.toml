[package]
name = "selvedge"
version = "0.0.4"
edition = "2024"
# File::try_lock, which the update lock is built on, is stable from 1.89.
rust-version = "1.89"
description = "Keeps a binary and the desktop frontends it feeds from coming apart"
license = "MIT"
repository = "https://github.com/Arzaroth/selvedge"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls", "archive-tar", "compression-flate2", "archive-zip", "compression-zip-deflate"] }
http = "1"
