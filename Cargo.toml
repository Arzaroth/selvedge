[package]
name = "selvedge"
version = "0.7.0"
edition = "2024"
# File::try_lock, which the update lock is built on, is stable from 1.89.
rust-version = "1.89"
description = "Keeps a binary and the desktop frontends it feeds from coming apart"
license = "MIT OR WTFPL"
repository = "https://github.com/Arzaroth/selvedge"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self_update = { version = "0.44", default-features = false, features = ["reqwest", "archive-tar", "compression-flate2", "archive-zip", "compression-zip-deflate"], optional = true }
http = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }

[features]
default = ["self-update"]
# Fetching a release is the half that links a network stack. A caller that only
# installs payloads - a GUI reading a cached check and shelling out to whoever
# owns the network - takes this crate without it.
self-update = ["updater", "self_update/rustls"]
# The updater without a TLS provider: rustls is linked but its crypto is
# whatever the caller installs as the process default, so a binary already
# built on ring does not link aws-lc beside it.
updater = ["dep:self_update", "dep:http", "dep:reqwest"]
